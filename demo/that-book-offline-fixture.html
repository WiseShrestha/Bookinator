 investigates a crime or mystery, professionally or as an amateur."},{id:"q08",category:"protagonists",group:"magic_supernatural",recallability:1,adaptation_sensitive:!1,text:"Does a central character have supernatural abilities established in the premise?",definition:"A main character has magical or supernatural powers that are known early, not revealed as a twist."},{id:"q09",category:"setting",group:"school",recallability:1,adaptation_sensitive:!1,text:"Is a school a major setting?",definition:"A substantial part of the main story takes place at school."},{id:"q10",category:"setting",group:"city",recallability:1,adaptation_sensitive:!1,text:"Does much of it take place in a large city?",definition:"A substantial part of the story is set in a large city (real or invented)."},{id:"q11",category:"setting",group:"rural",recallability:1,adaptation_sensitive:!1,text:"Does much of it take place in a village or rural area?",definition:"A substantial part of the story is set in a village, countryside or farmland."},{id:"q12",category:"setting",group:"korea",recallability:1,adaptation_sensitive:!1,text:"Does much of it take place in Korea?",definition:"A substantial part of the story is set in Korea."},{id:"q13",category:"setting",group:"britain",recallability:1,adaptation_sensitive:!1,text:"Does much of it take place in Britain?",definition:"A substantial part of the story is set in England, Scotland, Wales or Northern Ireland."},{id:"q14",category:"setting",group:"usa",recallability:1,adaptation_sensitive:!1,text:"Does much of it take place in the United States?",definition:"A substantial part of the story is set in the United States as it exists or existed."},{id:"q15",category:"setting",group:"invented_world",recallability:1,adaptation_sensitive:!1,text:"Is it mainly set in an invented world?",definition:"Most of the story takes place in a fictional world or land that is not our Earth."},{id:"q16",category:"setting",group:"sea",recallability:1,adaptation_sensitive:!1,te
